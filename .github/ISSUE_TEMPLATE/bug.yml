name: Documentation or site bug
description: Report incorrect documentation, broken links, or site behavior
title: "docs: "
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected content or behavior
    validations:
      required: true
